{% extends "base.html" %}

{% block title %}Registro | SaludYa{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand">
            <img class="auth-logo" src="{{ url_for('static', filename='saludya-logo.svg') }}" alt="SaludYa IPS">
            <div class="brand-copy">
                <h1>Crear cuenta</h1>
                <p class="hero-text">
                    Registro simple para empezar a gestionar citas desde el portal.
                </p>
            </div>
        </div>

        <form class="form-grid" action="/guardar" method="POST">
            <label class="form-field">
                <span>Nombre completo</span>
                <input type="text" name="nombre" placeholder="Tu nombre" autocomplete="name" required>
            </label>

            <label class="form-field">
                <span>Correo electrónico</span>
                <input type="email" name="correo" placeholder="nombre@correo.com" autocomplete="email" required>
            </label>

            <label class="form-field">
                <span>Contraseña</span>
                <input type="password" name="contrasena" placeholder="Crea una contraseña" autocomplete="new-password" required>
            </label>

            <button class="btn btn-primary btn-block" type="submit">Registrarme</button>
        </form>

        <p class="form-footer">
            ¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a>
        </p>
    </div>
</section>
{% endblock %}

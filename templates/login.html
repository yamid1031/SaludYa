{% extends "base.html" %}

{% block title %}Ingreso | SaludYa{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand">
            <img class="auth-logo" src="{{ url_for('static', filename='saludya-logo.svg') }}" alt="SaludYa IPS">
            <div class="brand-copy">
                <h1>Iniciar sesión</h1>
                <p class="hero-text">
                    Accede a tu portal para gestionar citas y revisar tu historial.
                </p>
            </div>
        </div>

        <form class="form-grid" action="/ingresar" method="POST">
            <label class="form-field">
                <span>Correo electrónico</span>
                <input type="email" name="correo" placeholder="nombre@correo.com" autocomplete="email" required>
            </label>

            <label class="form-field">
                <span>Contraseña</span>
                <input type="password" name="contrasena" placeholder="Tu contraseña" autocomplete="current-password" required>
            </label>

            <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
        </form>

        <p class="form-footer">
            ¿Aún no tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate aquí</a>
        </p>
    </div>
</section>
{% endblock %}
